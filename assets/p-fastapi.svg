<text x="68" y="180.5" text-anchor="middle" font-family="'JetBrains Mono', Consolas, monospace" font-size="12" font-weight="500" fill="#10b981">FastAPI</text>
<rect x="116" y="162" width="88" height="28" rx="8" fill="#131c2e" stroke="#223254" stroke-width="1"/>
<text x="160" y="180.5" text-anchor="middle" font-family="'JetBrains Mono', Consolas, monospace" font-size="12" font-weight="500" fill="#10b981">Python 3</text>
<rect x="212" y="162" width="80" height="28" rx="8" fill="#131c2e" stroke="#223254" stroke-width="1"/>
<text x="252" y="180.5" text-anchor="middle" font-family="'JetBrains Mono', Consolas, monospace" font-size="12" font-weight="500" fill="#10b981">PyMongo</text>
<rect x="300" y="162" width="80" height="28" rx="8" fill="#131c2e" stroke="#223254" stroke-width="1"/>
<text x="340" y="180.5" text-anchor="middle" font-family="'JetBrains Mono', Consolas, monospace" font-size="12" font-weight="500" fill="#10b981">Swagger</text>


