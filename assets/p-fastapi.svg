      <stop offset="0%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <clipPath id="clip-06">
      <rect width="540" height="216" rx="18"/>
    </clipPath>
  </defs>

  <style>
    .sans { font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    .mono { font-family: 'JetBrains Mono', Consolas, monospace; }
  </style>

  <g clip-path="url(#clip-06)">
    <!-- Card Background -->
    <rect width="540" height="216" fill="#0b101c"/>
    <rect width="540" height="3.5" fill="url(#top-bar-06)"/>
    
    <!-- Ambient subtle background glow -->
    <circle cx="500" cy="30" r="110" fill="#059669" opacity="0.08"/>
