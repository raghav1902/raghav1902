<svg xmlns="http://www.w3.org/2000/svg" width="1050" height="340" viewBox="0 0 1050 340" role="img" aria-label="Distributed AI &amp; Web Systems Architecture">
  <defs>
    <linearGradient id="abg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080c16"/>
      <stop offset="50%" stop-color="#0b1120"/>
      <stop offset="100%" stop-color="#060911"/>
    </linearGradient>
    <linearGradient id="edge-flow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#818cf8"/>
      <stop offset="50%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>
    <filter id="ablur" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="60"/>
    </filter>
    <clipPath id="aclip">
      <rect width="1050" height="340" rx="20"/>
    </clipPath>
  </defs>

  <style>
    .sans { font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    .mono { font-family: 'JetBrains Mono', Consolas, monospace; }
  </style>

  <g clip-path="url(#aclip)">
    <rect width="1050" height="340" fill="url(#abg)"/>
    <circle cx="200" cy="40" r="130" fill="#6366f1" opacity="0.10" filter="url(#ablur)"/>
    <circle cx="850" cy="300" r="140" fill="#06b6d4" opacity="0.10" filter="url(#ablur)"/>
    <circle cx="525" cy="170" r="120" fill="#10b981" opacity="0.08" filter="url(#ablur)"/>

    <!-- Header / Eyebrow -->
    <text x="36" y="38" class="mono" font-size="12" font-weight="700" letter-spacing="2" fill="#38bdf8">SYSTEM ARCHITECTURE BLUEPRINT // FULL-STACK &amp; RAG PIPELINES</text>
    <line x1="36" y1="52" x2="1014" y2="52" stroke="#161f33" stroke-width="1"/>

    <!-- Node 1: Client & Frontend (x=36, y=75, w=220, h=230) -->
    <g transform="translate(36, 75)">
      <rect width="220" height="230" rx="14" fill="#0e1526" stroke="#223254" stroke-width="1.2"/>
      <rect width="220" height="32" rx="14" fill="#141d33"/>
      <circle cx="16" cy="16" r="4.5" fill="#38bdf8"/>
      <text x="30" y="21" class="mono" font-size="11.5" font-weight="700" fill="#38bdf8">CLIENT &amp; EDGE</text>
      
      <!-- Content -->
      <g transform="translate(16, 52)" class="sans" font-size="12">
        <text y="0" font-weight="700" fill="#ffffff">Next.js 14 App Router</text>
        <text y="18" fill="#94a3b8">Server-Side Rendering (SSR)</text>
        <text y="36" fill="#94a3b8">Edge Route Handlers</text>

        <line x1="0" y1="50" x2="188" y2="50" stroke="#1c2842" stroke-width="1"/>

        <text y="70" font-weight="700" fill="#ffffff">React.js &amp; Tailwind</text>
        <text y="88" fill="#94a3b8">Optimistic UI State</text>
        <text y="106" fill="#94a3b8">WebSocket / Real-Time Slots</text>

        <rect x="0" y="124" width="188" height="26" rx="6" fill="#111c30" stroke="#1e2c4a" stroke-width="1"/>
        <text x="94" y="141" text-anchor="middle" class="mono" font-size="11" fill="#38bdf8">sub-100ms FCP on Vercel</text>
      </g>
    </g>

    <!-- Connector 1 -> 2 -->
    <g transform="translate(262, 175)">
      <line x1="0" y1="0" x2="28" y2="0" stroke="url(#edge-flow)" stroke-width="2" stroke-dasharray="4,3"/>
      <polygon points="28,-4 36,0 28,4" fill="#38bdf8"/>
    </g>

    <!-- Node 2: Async API Gateway & Auth (x=306, y=75, w=225, h=230) -->
    <g transform="translate(306, 75)">
      <rect width="225" height="230" rx="14" fill="#0e1526" stroke="#223254" stroke-width="1.2"/>
      <rect width="225" height="32" rx="14" fill="#141d33"/>
      <circle cx="16" cy="16" r="4.5" fill="#818cf8"/>
      <text x="30" y="21" class="mono" font-size="11.5" font-weight="700" fill="#818cf8">GATEWAY &amp; SERVICE</text>

      <g transform="translate(16, 52)" class="sans" font-size="12">
        <text y="0" font-weight="700" fill="#ffffff">FastAPI (Python 3)</text>
        <text y="18" fill="#94a3b8">Non-blocking Asynchronous ASGI</text>
        <text y="36" fill="#94a3b8">OpenAPI Specs &amp; PyDantic</text>

        <line x1="0" y1="50" x2="193" y2="50" stroke="#1c2842" stroke-width="1"/>

        <text y="70" font-weight="700" fill="#ffffff">Node.js / Express Core</text>
        <text y="88" fill="#94a3b8">JWT Role-Based Access (RBAC)</text>
        <text y="106" fill="#94a3b8">Rate Limiting &amp; Zod Defense</text>

        <rect x="0" y="124" width="193" height="26" rx="6" fill="#111c30" stroke="#1e2c4a" stroke-width="1"/>
        <text x="96.5" y="141" text-anchor="middle" class="mono" font-size="11" fill="#818cf8">Zero-Trust Auth Pipeline</text>
      </g>
    </g>

    <!-- Connector 2 -> 3 -->
    <g transform="translate(537, 175)">
      <line x1="0" y1="0" x2="28" y2="0" stroke="url(#edge-flow)" stroke-width="2" stroke-dasharray="4,3"/>
      <polygon points="28,-4 36,0 28,4" fill="#34d399"/>
    </g>

    <!-- Node 3: AI Agents & Vector RAG (x=581, y=75, w=225, h=230) -->
    <g transform="translate(581, 75)">
      <rect width="225" height="230" rx="14" fill="#0e1526" stroke="#223254" stroke-width="1.2"/>
      <rect width="225" height="32" rx="14" fill="#141d33"/>
      <circle cx="16" cy="16" r="4.5" fill="#34d399"/>
      <text x="30" y="21" class="mono" font-size="11.5" font-weight="700" fill="#34d399">RAG &amp; AI ENGINE</text>

      <g transform="translate(16, 52)" class="sans" font-size="12">
        <text y="0" font-weight="700" fill="#ffffff">ChromaDB Vector Store</text>
        <text y="18" fill="#94a3b8">15.8k+ SC Judgments Indexed</text>
        <text y="36" fill="#94a3b8">Cosine Similarity Re-Ranking</text>

        <line x1="0" y1="50" x2="193" y2="50" stroke="#1c2842" stroke-width="1"/>

        <text y="70" font-weight="700" fill="#ffffff">Gemini ADK &amp; Groq</text>
        <text y="88" fill="#94a3b8">Multi-Agent Workflow Routing</text>
        <text y="106" fill="#94a3b8">Gemini Vision OCR Ingestion</text>

        <rect x="0" y="124" width="193" height="26" rx="6" fill="#111c30" stroke="#1e2c4a" stroke-width="1"/>
        <text x="96.5" y="141" text-anchor="middle" class="mono" font-size="11" fill="#34d399">&lt; 180ms Latency Vector Hop</text>
      </g>
    </g>

    <!-- Connector 3 -> 4 -->
    <g transform="translate(812, 175)">
      <line x1="0" y1="0" x2="28" y2="0" stroke="url(#edge-flow)" stroke-width="2" stroke-dasharray="4,3"/>
      <polygon points="28,-4 36,0 28,4" fill="#a78bfa"/>
    </g>

    <!-- Node 4: Storage & Cloud Infra (x=856, y=75, w=158, h=230) -->
    <g transform="translate(856, 75)">
      <rect width="158" height="230" rx="14" fill="#0e1526" stroke="#223254" stroke-width="1.2"/>
      <rect width="158" height="32" rx="14" fill="#141d33"/>
      <circle cx="16" cy="16" r="4.5" fill="#a78bfa"/>
      <text x="30" y="21" class="mono" font-size="11.5" font-weight="700" fill="#a78bfa">CLOUD &amp; DATA</text>

      <g transform="translate(14, 52)" class="sans" font-size="12">
        <text y="0" font-weight="700" fill="#ffffff">MongoDB Atlas</text>
        <text y="18" fill="#94a3b8">Multi-Tenant CRM</text>
        <text y="36" fill="#94a3b8">Compound Indices</text>

        <line x1="0" y1="50" x2="130" y2="50" stroke="#1c2842" stroke-width="1"/>

        <text y="70" font-weight="700" fill="#ffffff">Google Cloud</text>
        <text y="88" fill="#94a3b8">Terraform (IaC)</text>
        <text y="106" fill="#94a3b8">Compute Engine</text>

        <rect x="0" y="124" width="130" height="26" rx="6" fill="#111c30" stroke="#1e2c4a" stroke-width="1"/>
        <text x="65" y="141" text-anchor="middle" class="mono" font-size="10.5" fill="#a78bfa">99.9% Uptime</text>
      </g>
    </g>
  </g>

  <!-- Outer Border -->
  <rect x="0.6" y="0.6" width="1048.8" height="338.8" rx="19.4" fill="none" stroke="#1e293b" stroke-width="1.2"/>
</svg>