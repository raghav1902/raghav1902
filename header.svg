<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="260" viewBox="0 0 1200 260" role="img" aria-label="Raghav Kakrania - Full-Stack &amp; AI Systems Developer">
  <defs>
    <linearGradient id="h-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070a13"/>
      <stop offset="50%" stop-color="#0d1424"/>
      <stop offset="100%" stop-color="#05070c"/>
    </linearGradient>
    <linearGradient id="h-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#818cf8"/>
      <stop offset="50%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>
    <pattern id="h-dots" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#38bdf8" fill-opacity="0.08"/>
    </pattern>
    <filter id="h-blur" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="60"/>
    </filter>
  </defs>

  <rect width="1200" height="260" rx="20" fill="url(#h-bg)"/>
  <rect width="1200" height="260" rx="20" fill="url(#h-dots)"/>
  <circle cx="1000" cy="50" r="140" fill="#6366f1" opacity="0.25" filter="url(#h-blur)"/>
  <circle cx="200" cy="220" r="120" fill="#06b6d4" opacity="0.18" filter="url(#h-blur)"/>

  <!-- Top Pill -->
  <g transform="translate(600, 48)">
    <rect x="-180" y="0" width="360" height="32" rx="16" fill="#111827" fill-opacity="0.8" stroke="#223254" stroke-width="1"/>
    <circle cx="-160" cy="16" r="4.5" fill="#10b981"/>
    <text x="-144" y="21" font-family="'JetBrains Mono', Consolas, monospace" font-size="11.5" font-weight="600" fill="#38bdf8" letter-spacing="1.5">FULL-STACK &amp; AI SYSTEMS DEVELOPER</text>
  </g>

  <!-- Title -->
  <text x="600" y="132" text-anchor="middle" font-family="'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="52" font-weight="800" letter-spacing="-1.2" fill="#ffffff">
    Raghav <tspan fill="url(#h-grad)">Kakrania</tspan>
  </text>

  <!-- Subtitle -->
  <text x="600" y="174" text-anchor="middle" font-family="'JetBrains Mono', Consolas, monospace" font-size="15" font-weight="500" fill="#94a3b8" letter-spacing="2">
    NEXT.JS 14  ·  FASTAPI  ·  CHROMADB RAG  ·  GOOGLE CLOUD AI  ·  JAIPUR, INDIA
  </text>

  <!-- Metrics row -->
  <g transform="translate(600, 216)">
    <text text-anchor="middle" font-family="'Plus Jakarta Sans', -apple-system, sans-serif" font-size="13.5" font-weight="600" fill="#cbd5e1">
      <tspan fill="#38bdf8">9+ Credly Digital Badges</tspan>  ·  <tspan fill="#a78bfa">2+ Industry Internships</tspan>  ·  <tspan fill="#34d399">15.8k+ Judgments Indexed</tspan>
    </text>
  </g>

  <rect x="0.6" y="0.6" width="1198.8" height="258.8" rx="19.4" fill="none" stroke="#1f2c4a" stroke-width="1.2"/>
</svg>